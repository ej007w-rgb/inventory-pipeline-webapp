# Render Blueprint for the inventory pipeline web app.
# Deploy via the Render dashboard (New > Blueprint, point at this repo)
# or let the API create the service from the repo URL.
services:
  - type: web
    name: inventory-pipeline
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /health
    # PORT is set automatically by Render; the Dockerfile reads $PORT.
